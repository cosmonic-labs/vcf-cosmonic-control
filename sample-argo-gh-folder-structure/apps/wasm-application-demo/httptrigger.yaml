apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: welcome-tour-test
  namespace: default
spec:
  deployPolicy: RollingUpdate
  replicas: 1
  template:
    spec:
      components:
      - image: ghcr.io/cosmonic-labs/components/welcome-tour:0.1.0
        localResources:
          environment:
            config:
              consolehost: http://console.vcf.cosmonic.world
              consoleport: "8080"
        name: welcome-tour
      hostInterfaces:
      - interfaces:
        - incoming-handler
        namespace: wasi
        package: http
        config:
          host: welcome-tour.vcf-wasm.cosmonic.world
      - interfaces:
        - logging
        namespace: wasi
        package: logging
        version: 0.1.0-draft
      - interfaces:
        - store
        namespace: wasi
        package: config
        version: 0.2.0-rc.1
---
apiVersion: control.cosmonic.io/v1alpha2
kind: HTTPTrigger
metadata:
  name: welcome-tour-test
  namespace: default
spec:
  hostnames:
  - welcome-tour.vcf-wasm.cosmonic.world
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: welcome-tour-test
