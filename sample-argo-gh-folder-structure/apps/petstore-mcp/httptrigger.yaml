apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: petstore-mcp
  namespace: cosmonic
spec:
  replicas: 1
  template:
    spec:
      components:
      - image: ghcr.io/cosmonic-labs/petstore-mcp-server:v0.2.0
        name: petstore-mcp
      hostInterfaces:
      - interfaces:
        - incoming-handler
        namespace: wasi
        package: http
        config:
          host: petstore-mcp.vcf-wasm.cosmonic.world
      - interfaces:
        - logging
        namespace: wasi
        package: logging
        version: 0.1.0-draft
      - interfaces:
        - store
        namespace: wasi
        package: config
        version: 0.2.0-rc.1
---
apiVersion: control.cosmonic.io/v1alpha2
kind: HTTPTrigger
metadata:
  name: petstore-mcp
  namespace: cosmonic
spec:
  hostnames:
  - petstore-mcp.vcf-wasm.cosmonic.world
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: petstore-mcp
